name: Windows release checks
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for test and launcher interpreters
        run: |
          python -m pip install -r requirements.txt
          py -3 -m pip install -r requirements.txt
      - run: python -m compileall -q _source _wiki_tmp/parse_builds.py
      - run: python -m unittest discover -s tests -v
      - name: Missing Cookie launcher
        shell: cmd
        run: |
          chcp 65001 >nul
          echo. | call 检查米游社Cookie.bat > launcher-check.txt 2>&1
          set "CHECK_EXIT=%ERRORLEVEL%"
          type launcher-check.txt
          if "%CHECK_EXIT%"=="0" exit /b 1
          findstr /C:"Traceback" launcher-check.txt >nul && exit /b 1
          findstr /C:"Cookie" launcher-check.txt >nul
      - name: Offline update launcher
        shell: cmd
        run: |
          chcp 65001 >nul
          echo. | call 更新数据.bat --offline
      - name: Missing Python launcher
        shell: cmd
        run: |
          chcp 65001 >nul
          set "PATH=%SystemRoot%\System32"
          echo. | call 检查米游社Cookie.bat > no-python.txt 2>&1
          set "CHECK_EXIT=%ERRORLEVEL%"
          type no-python.txt
          if "%CHECK_EXIT%"=="0" exit /b 1
          findstr /C:"Python" no-python.txt >nul
